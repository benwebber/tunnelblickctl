[package]
name = "tunnelblickctl"
version = "0.3.0"
authors = ["Ben Webber"]
edition = "2024"
rust-version = "1.85"

[dependencies]
csv        = "1"
humansize  = "2"
osascript  = "0.3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tabwriter  = "1"

[dependencies.clap]
version  = "4"
features = ["derive"]

[profile.release]
lto            = true
codegen-units  = 1
